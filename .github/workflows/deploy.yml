name: AutoServe Pro — CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

# Prevent multiple workflows running simultaneously
# If a new push happens while pipeline is running, cancel the old one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ca-central-1
  TF_VERSION: 1.14.6

jobs:
  # ===========================================================================
  # JOB 1 — TERRAFORM PLAN
  # Runs on every push and every PR
  # Shows exactly what infrastructure changes will happen
  # Safe — read only, never touches real infrastructure
  # ===========================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    permissions:
      id-token: write       # required for OIDC
      contents: read        # required to checkout code
      pull-requests: write  # required to post plan as PR comment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true  # warn but don't fail pipeline on formatting

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      # Save plan to S3 (not GitHub artifacts — repo is public, tfplan can contain secrets)
      # run_id makes the key unique per workflow run so jobs never collide
      - name: Upload plan to S3
        run: aws s3 cp tfplan s3://autoserve-app-terraform-state/plans/tfplan-${{ github.run_id }}

      # Post plan output as PR comment so you can review before merging
      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📋
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ===========================================================================
  # JOB 2 — TERRAFORM APPLY
  # Only runs on push to main (i.e. when PR is merged)
  # Downloads the exact plan from Job 1 — applies nothing more, nothing less
  # ===========================================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      # Download the exact plan saved by Job 1 from S3
      - name: Download plan from S3
        run: aws s3 cp s3://autoserve-app-terraform-state/plans/tfplan-${{ github.run_id }} tfplan

      # Apply exactly what was planned — no re-plan, no surprises
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # ===========================================================================
  # JOB 3 — DEPLOY APPLICATION
  # Only runs on push to main after terraform apply succeeds
  # Deploys new Flask code to EC2 via SSM
  # Uploads frontend files to S3
  # Invalidates CloudFront cache
  # ===========================================================================
  deploy-app:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      # Get ASG name, CloudFront distribution ID, and S3 bucket name from Terraform outputs
      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          echo "asg_name=$(terraform output -raw asg_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "bucket_name=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT

      # Deploy new Flask code to EC2 via SSM — no SSH keys needed
      - name: Deploy Flask app to EC2
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${{ steps.tf_outputs.outputs.asg_name }} \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          echo "Deploying to instances: $INSTANCE_IDS"

          for INSTANCE_ID in $INSTANCE_IDS; do
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters '{"commands":["cd /home/ec2-user/app && git pull","systemctl restart autoserve","systemctl restart autoserve-worker"]}' \
              --region ${{ env.AWS_REGION }}
            echo "Deploy command sent to $INSTANCE_ID"
          done

      # Upload frontend files to S3
      - name: Upload frontend to S3
        run: |
          aws s3 sync ./frontend s3://${{ steps.tf_outputs.outputs.bucket_name }} \
            --delete \
            --region ${{ env.AWS_REGION }}

      # Invalidate CloudFront cache so users see new version immediately
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf_outputs.outputs.cloudfront_id }} \
            --paths "/*"
